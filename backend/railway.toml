# Railway service config for the API.
#
# Railway reads this from the service's Root Directory, so the service must be
# created with Root Directory = /backend. The railway.json at the repo root only
# carries defaults shared by both services; this file wins for anything it sets.
#
# Everything secret (DATABASE_URL, JWT_SECRET, S3_*, ANTHROPIC_API_KEY) lives in
# Railway service variables, never here — this file is in git.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Don't rebuild and restart the API because someone changed a button colour.
watchPatterns = ["backend/**", "railway.json"]

[deploy]
# Mirrors the image CMD, spelled out so the deploy log shows what ran. Migrations
# are part of the start command deliberately: the container must not begin
# serving until the schema matches the code it was built from.
#
# numReplicas stays 1. Two containers running `alembic upgrade head` against the
# same database at the same time will block on the alembic_version row, and the
# loser can time out mid-migration. Before scaling past 1, move the migration
# into a Railway pre-deploy command.
startCommand = "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"
numReplicas = 1

healthcheckPath = "/health"
# Generous, because the first deploy of a release runs every pending migration
# before /health can answer. A tight timeout here fails a deploy that is working.
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
